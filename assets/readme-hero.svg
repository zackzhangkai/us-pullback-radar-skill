<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="US Pullback Radar：每天一次美股回撤风险体检，六类信号，共振才提醒">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <title>US Pullback Radar：每天一次美股回撤风险体检，六类信号，共振才提醒</title>
  <circle cx="980" cy="90" r="220" fill="url(#glow)"/>

  <!-- grid motif -->
  <g stroke="#223041" stroke-width="1">
    <line x1="0" y1="318" x2="1200" y2="318"/>
    <line x1="52" y1="0" x2="52" y2="380"/>
    <line x1="640" y1="0" x2="640" y2="380" stroke-dasharray="2 8"/>
  </g>

  <!-- left: title block -->
  <g>
    <rect x="52" y="56" width="140" height="30" rx="15" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <text x="122" y="76" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#fbbf24">AGENT SKILL</text>

    <text x="52" y="140" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#e8eef4">US Pullback Radar</text>
    <text x="52" y="186" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#aab8c5">每天一次美股回撤风险体检，共振才提醒</text>

    <!-- signal lights strip -->
    <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="18">
      <rect x="52" y="228" width="30" height="30" rx="15" fill="#ef4444"/>
      <text x="94" y="249" fill="#e8eef4">油价</text>
      <rect x="170" y="228" width="30" height="30" rx="15" fill="#ef4444"/>
      <text x="212" y="249" fill="#e8eef4">10Y 美债</text>
      <rect x="330" y="228" width="30" height="30" rx="15" fill="#ef4444"/>
      <text x="372" y="249" fill="#e8eef4">Fed 预期</text>
      <rect x="486" y="228" width="30" height="30" rx="15" fill="#f59e0b"/>
      <text x="528" y="249" fill="#e8eef4">均线</text>
    </g>

    <text x="52" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#5b6b7b">$ agent check --daily &#183; &#8805;2 signals &#8594; alert</text>
  </g>

  <!-- right: report card -->
  <g>
    <rect x="680" y="52" width="468" height="276" rx="14" fill="#151f2b" stroke="#2a3a4c" stroke-width="1.5"/>
    <circle cx="706" cy="76" r="6" fill="#ef4444"/>
    <circle cx="726" cy="76" r="6" fill="#f59e0b"/>
    <circle cx="746" cy="76" r="6" fill="#22c55e"/>
    <text x="908" y="82" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#5b6b7b">2026-09-29</text>

    <!-- risk badge -->
    <rect x="704" y="102" width="118" height="34" rx="8" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="1"/>
    <text x="763" y="125" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#fbbf24">风险 中</text>
    <text x="840" y="125" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" fill="#aab8c5">4 信号共振 · 指数仅 -1.7%</text>

    <!-- signal rows -->
    <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="19">
      <circle cx="718" cy="164" r="7" fill="#ef4444"/>
      <text x="738" y="170" fill="#e8eef4">布伦特 105 美元，年内 +75%</text>
      <circle cx="718" cy="200" r="7" fill="#ef4444"/>
      <text x="738" y="206" fill="#e8eef4">10Y 收益率 5.24%，2007 年来最高</text>
      <circle cx="718" cy="236" r="7" fill="#ef4444"/>
      <text x="738" y="242" fill="#e8eef4">10 月加息概率 70.9%</text>
      <circle cx="718" cy="272" r="7" fill="#f59e0b"/>
      <text x="738" y="278" fill="#e8eef4">标普距支撑 7,612 尚有 1%</text>
    </g>

    <line x1="704" y1="296" x2="1124" y2="296" stroke="#2a3a4c"/>
    <text x="704" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#5b6b7b">单信号 = 静默 &#183; 共振 = 简报 &#183; 零依赖</text>
  </g>
</svg>
